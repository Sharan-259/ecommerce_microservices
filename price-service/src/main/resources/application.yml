server:
  port: 8083

spring:
  application:
    name: price-service
  datasource:
    # File-based H2: data survives restarts. Path is relative to where you run "mvn spring-boot:run" (price-service folder).
    url: jdbc:h2:file:./data/price-service-db
    driver-class-name: org.h2.Driver
    username: sa
    password: price123
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.bosch.ecommerce.price: INFO
